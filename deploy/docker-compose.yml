# Productie op één VPS: app + Caddy (automatische HTTPS via Let's Encrypt).
# Gebruik: cp server/.env.example deploy/.env, invullen, dan: docker compose -f deploy/docker-compose.yml up -d --build
services:
  app:
    build: ..
    env_file: .env
    environment:
      HOST: 0.0.0.0
      TRUST_PROXY: "true"
      COOKIE_SECURE: "true"
    volumes:
      - seal-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
  caddy:
    image: caddy:2.8
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    environment:
      API_DOMAIN: ${API_DOMAIN:-api.sealcleaning.nl}
    restart: unless-stopped
    depends_on: [app]
volumes:
  seal-data:
  caddy-data:
